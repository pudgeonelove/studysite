<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="9 класс KG">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <title>9 класс Кыргызстан — учебная карта</title>
  <script>
    (() => {
      try {
        const savedTheme = localStorage.getItem("kgStudyTheme") || "light";
        document.documentElement.dataset.theme = savedTheme === "dark" ? "dark" : "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
  <style>
    :root {
      --paper: #f7f7f2;
      --paper-strong: #ffffff;
      --ink: #162132;
      --muted: #5e6878;
      --line: rgba(22, 33, 50, 0.12);
      --blue: #2866d6;
      --green: #0d947f;
      --coral: #e45d4f;
      --gold: #d89026;
      --violet: #7353ba;
      --shadow: 0 20px 60px rgba(22, 33, 50, 0.14);
      --radius: 8px;
      color-scheme: light;
      font-family: Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    }

    :root[data-theme="dark"] {
      --paper: #09111d;
      --paper-strong: #121b2a;
      --ink: #eef4ff;
      --muted: #a9b5c6;
      --line: rgba(232, 239, 250, 0.16);
      --shadow: 0 24px 70px rgba(0, 0, 0, 0.46);
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(247, 247, 242, 0.84), rgba(247, 247, 242, 0.97)),
        url("assets/study-map.png") center top / cover no-repeat fixed,
        var(--paper);
      letter-spacing: 0;
      overflow-x: hidden;
      overflow-wrap: anywhere;
      -webkit-tap-highlight-color: transparent;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(22, 33, 50, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(22, 33, 50, 0.035) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.8), transparent 72%);
    }

    a {
      color: inherit;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
    }

    .shell {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: calc(20px + env(safe-area-inset-top)) 0 calc(48px + env(safe-area-inset-bottom));
      position: relative;
      z-index: 1;
    }

    .topbar {
      min-height: 64px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
      padding: 12px 0 18px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mark {
      width: 42px;
      height: 42px;
      border-radius: var(--radius);
      display: grid;
      place-items: center;
      color: #ffffff;
      font-weight: 900;
      background:
        linear-gradient(135deg, var(--blue), var(--green) 50%, var(--gold));
      box-shadow: 0 12px 28px rgba(40, 102, 214, 0.24);
    }

    .brand h1 {
      margin: 0;
      font-size: clamp(1.05rem, 1rem + 0.7vw, 1.55rem);
      line-height: 1.1;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .top-actions {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .search {
      position: relative;
      width: min(320px, 48vw);
    }

    .search input {
      width: 100%;
      height: 42px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.72);
      color: var(--ink);
      padding: 0 14px 0 38px;
      outline: 0;
      box-shadow: 0 12px 30px rgba(22, 33, 50, 0.08);
      transition: border 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .search input:focus {
      border-color: rgba(40, 102, 214, 0.45);
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(40, 102, 214, 0.12);
    }

    .search::before {
      content: "";
      position: absolute;
      left: 14px;
      top: 50%;
      width: 13px;
      height: 13px;
      border: 2px solid var(--muted);
      border-radius: 50%;
      transform: translateY(-58%);
      opacity: 0.82;
    }

    .search::after {
      content: "";
      position: absolute;
      left: 26px;
      top: 27px;
      width: 8px;
      height: 2px;
      background: var(--muted);
      transform: rotate(45deg);
      border-radius: 99px;
      opacity: 0.82;
    }

    .pill-button,
    .ghost-button,
    .primary-button {
      min-height: 42px;
      border-radius: var(--radius);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 14px;
      font-weight: 750;
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
      white-space: nowrap;
      text-decoration: none;
    }

    .pill-button {
      color: var(--ink);
      background: rgba(255, 255, 255, 0.76);
      border: 1px solid var(--line);
    }

    .ghost-button {
      color: var(--ink);
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid var(--line);
    }

    .primary-button {
      color: #ffffff;
      background: var(--blue);
      box-shadow: 0 16px 36px rgba(40, 102, 214, 0.24);
    }

    .pill-button:hover,
    .ghost-button:hover,
    .primary-button:hover {
      transform: translateY(-2px);
    }

    .view {
      animation: viewIn 420ms cubic-bezier(.2, .8, .2, 1) both;
    }

    @keyframes viewIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .intro {
      min-height: 250px;
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(260px, 0.65fr);
      align-items: end;
      gap: 28px;
      padding: clamp(24px, 4vw, 52px);
      background:
        linear-gradient(120deg, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.66)),
        linear-gradient(90deg, rgba(40, 102, 214, 0.16), rgba(13, 148, 127, 0.14));
      border: 1px solid rgba(255, 255, 255, 0.74);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      overflow: hidden;
      position: relative;
    }

    .intro::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 6px;
      background: linear-gradient(90deg, var(--blue), var(--green), var(--gold), var(--coral), var(--violet));
    }

    .eyebrow {
      margin: 0 0 12px;
      color: var(--green);
      text-transform: uppercase;
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    .intro h2,
    .subject-head h2 {
      margin: 0;
      font-size: clamp(2.1rem, 1.35rem + 4vw, 5rem);
      line-height: 0.96;
      letter-spacing: 0;
      max-width: 780px;
    }

    .intro-copy {
      max-width: 690px;
      margin: 18px 0 0;
      color: #374255;
      font-size: clamp(1rem, 0.96rem + 0.35vw, 1.18rem);
      line-height: 1.65;
    }

    .stat-panel {
      display: grid;
      gap: 10px;
      align-self: stretch;
      align-content: end;
    }

    .stat {
      min-height: 72px;
      padding: 14px;
      background: rgba(255, 255, 255, 0.76);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      display: grid;
      gap: 4px;
    }

    .stat strong {
      font-size: 1.55rem;
      line-height: 1;
    }

    .stat span {
      color: var(--muted);
      font-size: 0.9rem;
    }

    .section-title {
      margin: 34px 0 16px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
    }

    .section-title h3 {
      margin: 0;
      font-size: clamp(1.2rem, 1rem + 1vw, 1.75rem);
    }

    .section-title p {
      margin: 0;
      color: var(--muted);
    }

    .subject-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .subject-card {
      min-height: 220px;
      padding: 18px;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.86);
      box-shadow: 0 14px 38px rgba(22, 33, 50, 0.08);
      text-align: left;
      color: var(--ink);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 18px;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      transition: transform 220ms ease, box-shadow 220ms ease, border 220ms ease;
    }

    .subject-card::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 5px;
      background: var(--accent);
    }

    .subject-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 28px 58px rgba(22, 33, 50, 0.16);
      border-color: color-mix(in srgb, var(--accent) 32%, #ffffff);
    }

    .subject-icon {
      width: 48px;
      height: 48px;
      border-radius: var(--radius);
      display: grid;
      place-items: center;
      color: #ffffff;
      background: var(--accent);
      font-weight: 900;
      box-shadow: 0 14px 26px color-mix(in srgb, var(--accent) 25%, transparent);
    }

    .subject-card h4 {
      margin: 0;
      font-size: 1.22rem;
    }

    .subject-card p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.45;
    }

    .progress-line {
      height: 8px;
      background: rgba(22, 33, 50, 0.08);
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-line span {
      display: block;
      height: 100%;
      width: var(--value);
      background: var(--accent);
      border-radius: inherit;
      transition: width 420ms ease;
    }

    .card-foot {
      display: grid;
      gap: 8px;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .empty {
      padding: 28px;
      border-radius: var(--radius);
      border: 1px dashed var(--line);
      background: rgba(255, 255, 255, 0.68);
      color: var(--muted);
    }

    .subject-view {
      display: grid;
      gap: 16px;
    }

    .subject-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: start;
      padding: clamp(22px, 3.6vw, 42px);
      border-radius: var(--radius);
      background:
        linear-gradient(120deg, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0.7)),
        linear-gradient(90deg, color-mix(in srgb, var(--accent) 22%, transparent), rgba(216, 144, 38, 0.12));
      border: 1px solid rgba(255, 255, 255, 0.82);
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }

    .subject-head::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 5px;
      background: linear-gradient(90deg, var(--accent), transparent);
    }

    .subject-head p {
      margin: 16px 0 0;
      color: #3d4859;
      max-width: 760px;
      line-height: 1.62;
    }

    .source-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 18px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      padding: 0 10px;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.7);
      border: 1px solid var(--line);
      color: #344052;
      font-size: 0.86rem;
      font-weight: 700;
    }

    .subject-meta {
      min-width: 170px;
      display: grid;
      gap: 10px;
    }

    .meta-box {
      border-radius: var(--radius);
      padding: 14px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--line);
    }

    .meta-box strong {
      display: block;
      font-size: 1.6rem;
      line-height: 1;
    }

    .meta-box span {
      color: var(--muted);
      font-size: 0.88rem;
    }

    .lesson-layout {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .topic-list,
    .lesson-panel,
    .sources-panel {
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(255, 255, 255, 0.84);
      box-shadow: 0 14px 42px rgba(22, 33, 50, 0.09);
    }

    .topic-list {
      padding: 10px;
      position: sticky;
      top: 12px;
      display: grid;
      gap: 8px;
    }

    .topic-button {
      width: 100%;
      min-height: 82px;
      padding: 13px;
      border-radius: var(--radius);
      background: transparent;
      text-align: left;
      color: var(--ink);
      display: grid;
      gap: 6px;
      border: 1px solid transparent;
      transition: background 180ms ease, border 180ms ease, transform 180ms ease;
    }

    .topic-button:hover,
    .topic-button.active {
      background: color-mix(in srgb, var(--accent) 9%, #ffffff);
      border-color: color-mix(in srgb, var(--accent) 26%, #ffffff);
      transform: translateX(3px);
    }

    .topic-button strong {
      font-size: 0.98rem;
    }

    .topic-button span {
      color: var(--muted);
      font-size: 0.84rem;
      line-height: 1.36;
    }

    .done-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: color-mix(in srgb, var(--accent) 30%, #cad0d8);
      display: inline-block;
      margin-right: 6px;
      vertical-align: 1px;
    }

    .done-dot.done {
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(13, 148, 127, 0.12);
    }

    .lesson-panel {
      min-height: 540px;
      padding: clamp(18px, 3vw, 32px);
      overflow: hidden;
    }

    .topic-kicker {
      display: flex;
      gap: 10px;
      align-items: center;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 800;
      margin: 0 0 12px;
    }

    .topic-kicker span {
      min-height: 28px;
      padding: 0 9px;
      border-radius: var(--radius);
      display: inline-flex;
      align-items: center;
      background: color-mix(in srgb, var(--accent) 12%, #ffffff);
      color: color-mix(in srgb, var(--accent) 72%, #111827);
    }

    .lesson-panel h3 {
      margin: 0;
      font-size: clamp(1.75rem, 1.25rem + 2vw, 3rem);
      line-height: 1.02;
    }

    .overview {
      margin: 18px 0 0;
      color: #303c4d;
      line-height: 1.72;
      font-size: 1.02rem;
    }

    .learning-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(260px, 0.85fr);
      gap: 14px;
      margin-top: 22px;
    }

    .note-block {
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: rgba(248, 250, 252, 0.88);
      padding: 16px;
    }

    .note-block h4 {
      margin: 0 0 10px;
      font-size: 1rem;
    }

    .note-block ul {
      margin: 0;
      padding-left: 18px;
      color: #364153;
      line-height: 1.62;
    }

    .reading-block {
      margin-top: 18px;
      padding: 18px;
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.86);
    }

    .reading-block h4 {
      margin: 0 0 12px;
      font-size: 1.04rem;
    }

    .reading-block p {
      margin: 0;
      color: #303c4d;
      line-height: 1.78;
      font-size: 1rem;
    }

    .reading-block p + p {
      margin-top: 12px;
    }

    .example {
      border-left: 4px solid var(--accent);
      background: color-mix(in srgb, var(--accent) 7%, #ffffff);
    }

    .example p {
      margin: 0;
      color: #303c4d;
      line-height: 1.65;
    }

    .actions-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 20px;
    }

    .quiz-box {
      margin-top: 18px;
      border-radius: var(--radius);
      border: 1px solid color-mix(in srgb, var(--accent) 24%, #ffffff);
      background: rgba(255, 255, 255, 0.78);
      overflow: hidden;
      animation: viewIn 320ms ease both;
    }

    .quiz-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      min-height: 58px;
      padding: 14px 16px;
      background: color-mix(in srgb, var(--accent) 11%, #ffffff);
      border-bottom: 1px solid color-mix(in srgb, var(--accent) 18%, #ffffff);
    }

    .quiz-head h4 {
      margin: 0;
      font-size: 1rem;
    }

    .quiz-form {
      display: grid;
      gap: 16px;
      padding: 16px;
    }

    .question {
      display: grid;
      gap: 10px;
      padding: 14px;
      border-radius: var(--radius);
      background: rgba(248, 250, 252, 0.92);
      border: 1px solid rgba(22, 33, 50, 0.08);
    }

    .question strong {
      line-height: 1.42;
    }

    .answers {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .answer {
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
      color: #273244;
      transition: border 180ms ease, background 180ms ease, transform 180ms ease;
    }

    .answer:hover {
      transform: translateY(-1px);
      border-color: color-mix(in srgb, var(--accent) 42%, #ffffff);
    }

    .answer input {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      flex: 0 0 auto;
    }

    .result {
      margin: 0 16px 16px;
      padding: 14px;
      border-radius: var(--radius);
      background: #f3f8f6;
      border: 1px solid rgba(13, 148, 127, 0.2);
      color: #1f4d44;
      line-height: 1.58;
    }

    .result.warn {
      background: #fff7e8;
      border-color: rgba(216, 144, 38, 0.25);
      color: #6a4612;
    }

    .sources-panel {
      padding: 18px;
      margin-top: 16px;
    }

    .sources-panel h3 {
      margin: 0 0 10px;
      font-size: 1.05rem;
    }

    .sources-panel p {
      margin: 0 0 12px;
      color: var(--muted);
      line-height: 1.55;
    }

    .source-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .source-list a {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      padding: 0 10px;
      border-radius: var(--radius);
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid var(--line);
      color: #314052;
      text-decoration: none;
      font-weight: 750;
      font-size: 0.88rem;
    }

    .footer {
      margin-top: 30px;
      color: rgba(22, 33, 50, 0.66);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .kbd-icon {
      width: 22px;
      height: 22px;
      display: inline-grid;
      place-items: center;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.78);
      color: currentColor;
      border: 1px solid var(--line);
      font-size: 0.74rem;
      font-weight: 900;
    }

    .theme-toggle {
      width: 42px;
      min-width: 42px;
      height: 42px;
      border-radius: var(--radius);
      display: inline-grid;
      place-items: center;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.76);
      border: 1px solid var(--line);
      box-shadow: 0 12px 28px rgba(22, 33, 50, 0.08);
      transition: transform 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }

    .theme-toggle:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 34px rgba(22, 33, 50, 0.13);
    }

    .theme-toggle svg {
      width: 19px;
      height: 19px;
      stroke-width: 2.2;
    }

    :root[data-theme="dark"] body {
      background:
        linear-gradient(180deg, rgba(7, 13, 24, 0.88), rgba(7, 13, 24, 0.98)),
        url("assets/study-map.png") center top / cover no-repeat fixed,
        var(--paper);
    }

    :root[data-theme="dark"] body::before {
      background-image:
        linear-gradient(rgba(232, 239, 250, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(232, 239, 250, 0.045) 1px, transparent 1px);
    }

    :root[data-theme="dark"] .search input,
    :root[data-theme="dark"] .pill-button,
    :root[data-theme="dark"] .ghost-button,
    :root[data-theme="dark"] .theme-toggle,
    :root[data-theme="dark"] .stat,
    :root[data-theme="dark"] .empty,
    :root[data-theme="dark"] .chip,
    :root[data-theme="dark"] .meta-box,
    :root[data-theme="dark"] .source-list a,

      physics: "В физике текст задачи нужно превращать в модель: выбрать тело, систему отсчета, известные величины и закон. Формула работает надежно только тогда, когда понятно, какое явление она описывает.",
      biology: "В биологии полезно рассматривать уровни организации жизни: молекула, клетка, организм, популяция, экосистема и биосфера. Один и тот же процесс часто имеет смысл сразу на нескольких уровнях.",
      geography: "В географии любой факт лучше привязывать к карте. Положение, рельеф, ресурсы, население, транспорт и хозяйство образуют цепочку причин и последствий.",
      history: "В истории важно соединять дату с процессом. События происходят не отдельно: у них есть причины, участники, решения, последствия и разные оценки в источниках.",
      informatics: "В информатике тема становится понятной, когда ее можно превратить в алгоритм. Нужно ясно назвать данные, действие, условие, результат и возможную ошибку.",
      kyrgyz: "В языке правило оживает в тексте. Нужно видеть, как звук, слово, форма и предложение помогают точно передать мысль в устной и письменной речи.",
      civics: "В обществоведении важно связывать понятия с реальными жизненными ситуациями: школа, семья, местное сообщество, государственные органы и права человека."
    };

    function buildReading(subject, topic) {
      const rememberText = topic.remember.map((item, index) => `${index + 1}) ${item}`).join(" ");
      return [
        `${topic.overview} ${subjectReadingFocus[subject.id] || "Тему лучше изучать через понятия, примеры и проверку себя вопросами."} Когда читаешь этот раздел, не спеши переходить к тесту: сначала попробуй объяснить главную идею своими словами, затем найди в тексте формулу, правило или причинно-следственную связь.`,
        `Разбор темы удобно вести в четыре шага. Сначала выпиши ключевые слова из названия темы. Потом отметь, какие величины, понятия, даты или термины встречаются чаще всего. После этого сравни новые знания с тем, что уже изучалось раньше. В конце составь короткий ответ на вопрос: "Что я теперь могу объяснить или решить?". Для этой темы опорные пункты такие: ${rememberText}`,
        `Типичная ошибка при изучении этой темы - запоминать отдельные слова без связи между ними. Если это формула, проверь единицы измерения и смысл каждой буквы. Если это исторический или географический материал, отдели факт от оценки и найди причину события. Если это язык или обществознание, придумай жизненную ситуацию, где правило действительно понадобится.`,
        `Мини-практика перед тестом: закрой конспект и восстанови пример по памяти. Затем измени одно условие и подумай, изменится ли ответ. Например: ${topic.example} Такой прием делает материал более устойчивым: ты не просто узнаешь правильный вариант, а понимаешь, почему он правильный.`
      ];
    }

    const app = document.querySelector("#app");
    const topActions = document.querySelector("#topActions");
    const storageKey = "kg-grade9-study-progress";
    const themeStorageKey = "kgStudyTheme";
    const themeMeta = document.querySelector('meta[name="theme-color"]');
    let currentSubjectId = null;
    let currentTopicIndex = 0;

    function loadProgress() {
      try {
        return JSON.parse(localStorage.getItem(storageKey)) || { completed: {}, scores: {} };
      } catch {
        return { completed: {}, scores: {} };
      }
    }

    let progress = loadProgress();

    function saveProgress() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(progress));
      } catch {
        // In private or restricted browser modes the site still works without saved progress.
      }
    }

    function currentTheme() {
      return document.documentElement.dataset.theme === "dark" ? "dark" : "light";
    }

    function themeIcon(theme = currentTheme()) {
      return theme === "dark"
        ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2m10-10h-2M4 12H2m17.1-7.1-1.4 1.4M6.3 17.7l-1.4 1.4m14.2 0-1.4-1.4M6.3 6.3 4.9 4.9"></path></svg>'
        : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.6 6.6 0 0 0 21 12.8Z"></path></svg>';
    }

    function themeButtonMarkup() {
      const theme = currentTheme();
      const label = theme === "dark" ? "Включить белую тему" : "Включить черную тему";
      return `<button class="theme-toggle" type="button" data-theme-toggle aria-label="${label}" title="${label}">${themeIcon(theme)}</button>`;
    }

    function updateThemeButtons() {
      document.querySelectorAll("[data-theme-toggle]").forEach(button => {
        const theme = currentTheme();
        const label = theme === "dark" ? "Включить белую тему" : "Включить черную тему";
        button.setAttribute("aria-label", label);
        button.setAttribute("title", label);
        button.innerHTML = themeIcon(theme);
      });
    }

    function applyTheme(theme = currentTheme()) {
      const nextTheme = theme === "dark" ? "dark" : "light";
      document.documentElement.dataset.theme = nextTheme;
      if (themeMeta) themeMeta.setAttribute("content", nextTheme === "dark" ? "#09111d" : "#f7f7f2");
      try {
        localStorage.setItem(themeStorageKey, nextTheme);
      } catch {
        // Theme simply falls back to the default when storage is unavailable.
      }
      updateThemeButtons();
    }

    function topicKey(subjectId, topicIndex) {
      return `${subjectId}:${topicIndex}`;
    }

    function countCompleted(subject) {
      return subject.topics.filter((_, index) => progress.completed[topicKey(subject.id, index)]).length;
    }

    function totalTopics() {
      return subjects.reduce((sum, subject) => sum + subject.topics.length, 0);
    }

    function allCompleted() {
      return subjects.reduce((sum, subject) => sum + countCompleted(subject), 0);
    }

    function renderTopActions(mode = "home") {
      if (mode === "home") {
        topActions.innerHTML = `
          <label class="search" aria-label="Поиск по предметам">
            <input id="searchInput" type="search" placeholder="Поиск предмета или темы">
          </label>
          <a class="primary-button" href="history-exam.html">
            <span class="kbd-icon">Э</span>
            Госэкзамен: история
          </a>
          ${themeButtonMarkup()}
        `;
      } else {
        topActions.innerHTML = `
          <a class="pill-button" href="history-exam.html">
            <span class="kbd-icon">Э</span>
            История: экзамен
          </a>
          <button class="ghost-button" type="button" data-home>
            <span class="kbd-icon">←</span>
            Предметы
          </button>
          ${themeButtonMarkup()}
        `;
      }
      updateThemeButtons();
    }

    function renderHome(filter = "") {
      currentSubjectId = null;
      renderTopActions("home");
      const query = filter.trim().toLowerCase();
      const filtered = subjects.filter(subject => {
        const haystack = [
          subject.title,
          subject.summary,
          ...subject.topics.map(topic => `${topic.title} ${topic.overview}`)
        ].join(" ").toLowerCase();
        return haystack.includes(query);
      });

      const cards = filtered.map(subject => {
        const done = countCompleted(subject);
        const percent = Math.round((done / subject.topics.length) * 100);
        return `
          <button class="subject-card" type="button" style="--accent:${subject.accent};" data-subject="${subject.id}">
            <div class="subject-icon" aria-hidden="true">${subject.icon}</div>
            <div>
              <h4>${subject.title}</h4>
              <p>${subject.summary}</p>
            </div>
            <div class="card-foot">
              <div class="progress-line" aria-hidden="true" style="--value:${percent}%"><span></span></div>
              <span>${done}/${subject.topics.length} тем закреплено</span>
            </div>
          </button>
        `;
      }).join("");

      app.className = "view";
      app.innerHTML = `
        <section class="intro">
          <div>
            <p class="eyebrow">9 класс • Кыргызстан</p>
            <h2>Выберите предмет</h2>
            <p class="intro-copy">Материалы собраны как авторские краткие конспекты по темам школьных программ и учебников Кыргызстана: без копирования параграфов, с примерами и мини-тестами для закрепления.</p>
          </div>
          <div class="stat-panel">
            <div class="stat"><strong>${subjects.length}</strong><span>предметов</span></div>
            <div class="stat"><strong>${totalTopics()}</strong><span>тем с тестами</span></div>
            <div class="stat"><strong>${allCompleted()}</strong><span>тем уже отмечено</span></div>
          </div>
        </section>

        <div class="section-title">
          <h3>Предметы</h3>
          <p>${filtered.length} из ${subjects.length}</p>
        </div>
        <section class="subject-grid">
          ${cards || `<div class="empty">Ничего не найдено. Попробуй другой запрос.</div>`}
        </section>

        ${renderSourcesPanel()}
        <p class="footer">Конспекты не заменяют учебник и объяснение учителя, а помогают быстро повторить тему и проверить себя.</p>
      `;

      const searchInput = document.querySelector("#searchInput");
      if (searchInput) {
        searchInput.value = filter;
        searchInput.focus({ preventScroll: true });
        searchInput.setSelectionRange(filter.length, filter.length);
      }
    }

    function renderSubject(subjectId, topicIndex = 0) {
      const subject = subjects.find(item => item.id === subjectId);
      if (!subject) {
        renderHome();
        return;
      }

      currentSubjectId = subjectId;
      currentTopicIndex = Math.max(0, Math.min(topicIndex, subject.topics.length - 1));
      renderTopActions("subject");
      const done = countCompleted(subject);
      const selected = subject.topics[currentTopicIndex];
      const topicButtons = subject.topics.map((topic, index) => {
        const key = topicKey(subject.id, index);
        return `
          <button class="topic-button ${index === currentTopicIndex ? "active" : ""}" type="button" data-topic="${index}">
            <strong><span class="done-dot ${progress.completed[key] ? "done" : ""}" aria-hidden="true"></span>${topic.title}</strong>
            <span>${topic.tag} • ${topic.time}</span>
          </button>
        `;
      }).join("");

      app.className = "view subject-view";
      app.innerHTML = `
        <section class="subject-head" style="--accent:${subject.accent};">
          <div>
            <p class="eyebrow">${subject.icon} • ${subject.title}</p>
            <h2>${subject.title}</h2>
            <p>${subject.summary}</p>
            <div class="source-chips">${subject.sources.map(label => `<span class="chip">${label}</span>`).join("")}</div>
          </div>
          <div class="subject-meta">
            <div class="meta-box"><strong>${subject.topics.length}</strong><span>темы</span></div>
            <div class="meta-box"><strong>${done}/${subject.topics.length}</strong><span>закреплено</span></div>
          </div>
        </section>

        <section class="lesson-layout" style="--accent:${subject.accent};">
          <nav class="topic-list" aria-label="Темы предмета">
            ${topicButtons}
          </nav>
          <article class="lesson-panel">
            ${renderTopic(subject, selected, currentTopicIndex)}
          </article>
        </section>
      `;
    }

    function renderTopic(subject, topic, topicIndex) {
      const key = topicKey(subject.id, topicIndex);
      const score = progress.scores[key];
      return `
        <p class="topic-kicker"><span>${topic.tag}</span>${topic.time}</p>
        <h3>${topic.title}</h3>
        <p class="overview">${topic.overview}</p>
        <div class="learning-grid">
          <div class="note-block">
            <h4>Запомнить</h4>
            <ul>
              ${topic.remember.map(item => `<li>${item}</li>`).join("")}
            </ul>
          </div>
          <div class="note-block example">
            <h4>Пример</h4>
            <p>${topic.example}</p>
          </div>
        </div>
        ${renderReading(subject, topic)}
        <div class="actions-row">
          <button class="primary-button" type="button" data-start-quiz>
            <span class="kbd-icon">?</span>
            Мини-тест
          </button>
          <button class="pill-button" type="button" data-complete-topic>
            <span class="kbd-icon">${progress.completed[key] ? "✓" : "+"}</span>
            ${progress.completed[key] ? "Тема закреплена" : "Отметить тему"}
          </button>
          ${score ? `<span class="chip">Лучший результат: ${score.score}/${score.total}</span>` : ""}
        </div>
        <div id="quizMount"></div>
      `;
    }

    function renderReading(subject, topic) {
      const paragraphs = topic.reading?.length ? topic.reading : buildReading(subject, topic);
      return `
        <section class="reading-block">
          <h4>Развернутый конспект</h4>
          ${paragraphs.map(paragraph => `<p>${paragraph}</p>`).join("")}
        </section>
      `;
    }

    function renderQuiz() {
      const subject = subjects.find(item => item.id === currentSubjectId);
      if (!subject) return;
      const topic = subject.topics[currentTopicIndex];
      const mount = document.querySelector("#quizMount");
      mount.innerHTML = `
        <section class="quiz-box">
          <div class="quiz-head">
            <h4>Мини-тест: ${topic.title}</h4>
            <span class="chip">${topic.quiz.length} вопроса</span>
          </div>
          <form class="quiz-form" data-quiz-form>
            ${topic.quiz.map((question, index) => `
              <div class="question">
                <strong>${index + 1}. ${question.q}</strong>
                <div class="answers">
                  ${question.a.map((answer, answerIndex) => `
                    <label class="answer">
                      <input type="radio" name="q${index}" value="${answerIndex}">
                      <span>${answer}</span>
                    </label>
                  `).join("")}
                </div>
              </div>
            `).join("")}
            <button class="primary-button" type="submit">Проверить ответы</button>
          </form>
          <div id="resultMount"></div>
        </section>
      `;
      mount.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function checkQuiz(form) {
      const subject = subjects.find(item => item.id === currentSubjectId);
      if (!subject) return;
      const topic = subject.topics[currentTopicIndex];
      const answers = topic.quiz.map((_, index) => form.querySelector(`input[name="q${index}"]:checked`));
      const resultMount = document.querySelector("#resultMount");
      if (answers.some(answer => !answer)) {
        resultMount.innerHTML = `<div class="result warn">Остался вопрос без ответа.</div>`;
        return;
      }

      let score = 0;
      const details = topic.quiz.map((question, index) => {
        const picked = Number(answers[index].value);
        const ok = picked === question.correct;
        if (ok) score += 1;
        return `${index + 1}. ${ok ? "Верно" : "Нужно повторить"}: ${question.explain}`;
      });

      const key = topicKey(subject.id, currentTopicIndex);
      const previous = progress.scores[key]?.score || 0;
      if (score >= previous) {
        progress.scores[key] = { score, total: topic.quiz.length };
      }
      if (score === topic.quiz.length) {
        progress.completed[key] = true;
      }
      saveProgress();

      resultMount.innerHTML = `
        <div class="result">
          <strong>Результат: ${score}/${topic.quiz.length}</strong>
          <br>
          ${details.join("<br>")}
        </div>
      `;
    }

    function renderSourcesPanel() {
      return `
        <section class="sources-panel">
          <h3>Источники структуры тем</h3>
          <p>Содержание страницы пересказано и адаптировано как краткие учебные заметки. Перечень предметов и тем сверялся с электронными библиотеками и программами Кыргызстана.</p>
          <div class="source-list">
            ${sources.map(source => `<a href="${source.url}" target="_blank" rel="noreferrer">${source.label}</a>`).join("")}
          </div>
        </section>
      `;
    }

    document.addEventListener("click", event => {
      const themeButton = event.target.closest("[data-theme-toggle]");
      if (themeButton) {
        applyTheme(currentTheme() === "dark" ? "light" : "dark");
        return;
      }

      const subjectButton = event.target.closest("[data-subject]");
      if (subjectButton) {
        renderSubject(subjectButton.dataset.subject, 0);
        scrollTo({ top: 0, behavior: "smooth" });
        return;
      }

      const homeButton = event.target.closest("[data-home]");
      if (homeButton) {
        renderHome();
        scrollTo({ top: 0, behavior: "smooth" });
        return;
      }

      const topicButton = event.target.closest("[data-topic]");
      if (topicButton && currentSubjectId) {
        renderSubject(currentSubjectId, Number(topicButton.dataset.topic));
        return;
      }

      if (event.target.closest("[data-start-quiz]")) {
        renderQuiz();
        return;
      }

      if (event.target.closest("[data-complete-topic]") && currentSubjectId) {
        const key = topicKey(currentSubjectId, currentTopicIndex);
        progress.completed[key] = true;
        saveProgress();
        renderSubject(currentSubjectId, currentTopicIndex);
      }
    });

    document.addEventListener("input", event => {
      if (event.target.id === "searchInput") {
        renderHome(event.target.value);
      }
    });

    document.addEventListener("submit", event => {
      const form = event.target.closest("[data-quiz-form]");
      if (!form) return;
      event.preventDefault();
      checkQuiz(form);
    });

    applyTheme(currentTheme());
    renderHome();
  </script>
</body>
</html>
